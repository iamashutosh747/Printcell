<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Print Cell</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <p class="boot" id="boot">Loading…</p>

  <!-- Sign in -->
  <main class="signin hidden" id="signin-view">
    <form id="signin" class="sheet signin-sheet" autocomplete="on">
      <div class="inks" aria-hidden="true"><i style="--i:var(--k)"></i><i style="--i:var(--m)"></i><i style="--i:var(--c)"></i><i style="--i:var(--y)"></i><i style="--i:var(--g)"></i></div>
      <div class="signin-body">
        <h1>Print Cell</h1>
        <p class="lede">Sign in once for Tasks, CSRC, DPR and Coverage.</p>
        <label for="si-user">Username</label>
        <input id="si-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="si-pass">Password</label>
        <input id="si-pass" name="password" type="password" autocomplete="current-password" required>
        <button class="btn wide" id="si-btn" type="submit">Sign in</button>
        <p class="msg error" id="si-msg" role="alert"></p>
      </div>
    </form>
  </main>

  <!-- Signed in -->
  <div class="shell hidden" id="shell">
    <aside class="rail" aria-label="Apps">
      <div class="who"><strong id="who-name"></strong><span id="who-role"></span></div>
      <nav class="chips" id="chips"></nav>
      <nav class="rail-foot" aria-label="Account">
        <a href="#/settings" data-nav="settings">Settings</a>
        <a href="#/admin" data-nav="admin" class="admin-only hidden">People</a>
        <a href="#/activity" data-nav="activity" class="admin-only hidden">Activity</a>
        <button type="button" id="signout">Sign out</button>
      </nav>
    </aside>

    <div class="main">
      <!-- Home: today across every app this person can use -->
      <main class="home hidden" id="home-view">
        <header class="bar">
          <h1 id="today-en"></h1><span class="np" id="today-np"></span>
          <div class="search" role="combobox" aria-expanded="false" aria-haspopup="listbox" aria-owns="search-results">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
            <input id="search" type="search" placeholder="Search customers, calls, tasks" autocomplete="off" aria-label="Search customers, calls and tasks" aria-autocomplete="list" aria-controls="search-results">
            <kbd aria-hidden="true">/</kbd>
            <div class="results hidden" id="search-results" role="listbox" aria-label="Search results"></div>
          </div>
        </header>
        <div class="areas" id="areas"></div>
        <p class="msg error" id="home-msg" role="alert"></p>
      </main>

      <!-- Settings -->
      <main class="page hidden" id="settings-view">
        <header class="bar"><h1>Settings</h1></header>
        <section class="sheet narrow" style="--band:var(--k)">
          <h2>Password</h2>
          <form id="pw-form" class="stack">
            <div><label for="pw-new">New password</label>
              <input id="pw-new" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></div>
            <div><label for="pw-again">Type it again</label>
              <input id="pw-again" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></div>
            <div><button class="btn" type="submit" id="pw-btn">Change password</button></div>
          </form>
          <p class="msg" id="pw-msg" role="status"></p>
        </section>
      </main>

      <!-- Admin: people and access -->
      <main class="page hidden" id="admin-view">
        <header class="bar"><h1>People</h1>
          <input class="filter" id="people-q" type="search" placeholder="Find a person" aria-label="Find a person">
          <button type="button" class="btn" id="add-person">Add person</button></header>
        <section class="sheet flush" style="--band:var(--k)"><div class="tbl-wrap" id="people"></div></section>
        <p class="msg" id="people-msg" role="status"></p>
      </main>

      <!-- Admin: activity -->
      <main class="page hidden" id="activity-view">
        <header class="bar"><h1>Activity</h1>
          <select id="f-person" aria-label="Person"></select>
          <div class="seg" id="f-event" role="group" aria-label="What happened">
            <button type="button" data-ev="" aria-pressed="true">Everything</button>
            <button type="button" data-ev="sign_in" aria-pressed="false">Sign-ins</button>
            <button type="button" data-ev="open_tasks" aria-pressed="false"><i style="--i:var(--m)"></i>Tasks</button>
            <button type="button" data-ev="open_csrc" aria-pressed="false"><i style="--i:var(--c)"></i>CSRC</button>
            <button type="button" data-ev="open_dpr" aria-pressed="false"><i style="--i:var(--y)"></i>DPR</button>
            <button type="button" data-ev="open_coverage" aria-pressed="false"><i style="--i:var(--g)"></i>Coverage</button>
          </div></header>
        <section class="sheet flush" style="--band:var(--k)"><div class="tbl-wrap" id="activity"></div></section>
        <p class="msg" id="activity-msg" role="status"></p>
      </main>
    </div>
  </div>

  <!-- Drill-down panel -->
  <div class="scrim hidden" id="scrim"></div>
  <aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden>
    <header class="panel-head" style="--band:var(--k)">
      <h2 id="panel-title"></h2>
      <button type="button" class="icon-btn" id="panel-close" aria-label="Close">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
    </header>
    <div class="panel-body" id="panel-body"></div>

    <form id="edit" class="panel-body hidden" novalidate>
      <div class="grid">
        <div><label for="e-name">Full name</label><input id="e-name" required></div>
        <div><label for="e-user">Username</label>
          <input id="e-user" autocapitalize="none" spellcheck="false" required pattern="[a-z0-9._\-]{2,32}">
          <p class="hint">Lowercase letters, numbers, dots or dashes. They type this to sign in.</p></div>
        <div><label for="e-pass" id="e-pass-label">Password</label>
          <input id="e-pass" type="password" autocomplete="new-password" minlength="8" maxlength="72">
          <p class="hint" id="e-pass-hint">At least 8 characters. Leave blank to set it later.</p></div>
        <div class="checks">
          <label class="check"><input type="checkbox" id="e-active" checked> Can sign in</label>
          <label class="check"><input type="checkbox" id="e-admin"> Portal admin (manages people)</label>
        </div>
      </div>
      <h3>Apps</h3>
      <div class="grid">
        <div><label for="e-tasks"><i class="dot" style="--i:var(--m)"></i>Tasks account</label><select id="e-tasks"></select></div>
        <div><label for="e-csrc"><i class="dot" style="--i:var(--c)"></i>CSRC account</label><select id="e-csrc"></select></div>
        <div><label for="e-dpr"><i class="dot" style="--i:var(--y)"></i>DPR access</label>
          <select id="e-dpr">
            <option value="">No access</option>
            <option value="full">Full report</option>
            <option value="pdc">PDC cheques only</option>
            <option value="agent">One agent's customers</option>
          </select></div>
        <div class="hidden" id="e-agent-wrap"><label for="e-agent">Agent</label><select id="e-agent"></select></div>
        <div class="checks hidden" id="e-export-wrap">
          <label class="check"><input type="checkbox" id="e-export"> Can export DPR lists to PDF</label>
        </div>
        <div><label for="e-coverage"><i class="dot" style="--i:var(--g)"></i>Coverage account</label><select id="e-coverage"></select></div>
      </div>
      <div class="actions">
        <button class="btn" type="submit" id="e-save">Save</button>
        <button class="btn quiet" type="button" id="e-cancel">Cancel</button>
      </div>
      <p class="msg error" id="e-msg" role="alert"></p>
    </form>
  </aside>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="toast-undo">Undo</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="schedule.js"></script>
<script src="portal.js"></script>
</body>
</html>
